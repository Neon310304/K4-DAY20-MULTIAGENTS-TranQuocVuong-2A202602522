[project]
name = "day20-multiagents-extension"
version = "0.1.0"
description = "Independent coordinator, workers and async communication exercises"
requires-python = ">=3.11"
dependencies = ["langchain-core>=1.0", "pandas>=2.0", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=6.0"]
live = ["langchain-openai>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
